name: Refresh Pages index

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate index from published repositories
        run: |
          set -euo pipefail
          {
            printf '%s\n' \
              '<!doctype html>' \
              '<meta charset="utf-8">' \
              '<meta name="viewport" content="width=device-width,initial-scale=1">' \
              '<title>hf7y</title>' \
              '<main>' \
              '  <h1>hf7y</h1>' \
              '  <ul>'

            gh api --paginate \
              "/users/$OWNER/repos?per_page=100&type=owner&sort=full_name" \
              --jq '.[] | select(.has_pages and .name != "hf7y.github.io") | .name' |
              while IFS= read -r repo; do
                page_url="$(gh api "repos/$OWNER/$repo/pages" --jq '.html_url')"
                printf '    <li><a href="%s">%s</a></li>\n' "$page_url" "$repo"
              done

            printf '%s\n' '  </ul>' '</main>'
          } > index.html
      - name: Commit changed index
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh Pages index"
          git push
