<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Weave Hot or Not</title>
<style>
/* one card fills the screen; swipe it off either side */
:root{--bg:#f3f1f6;--card:#fff;--fg:#17141c;--dim:#6f6a7a;--a:#b91c1c;--b:#1d4ed8;--hot:#0f7a4d;--not:#8a8496;--line:#dcd8e4}
@media (prefers-color-scheme:dark){:root{--bg:#121016;--card:#1d1a24;--fg:#f1eef7;--dim:#9a94a8;--a:#ff8a80;--b:#8ab4ff;--hot:#4fd39a;--not:#8a8496;--line:#322d3d;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.25 Georgia,"Iowan Old Style","Times New Roman",serif;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:none;padding:env(safe-area-inset-top,0) 8px env(safe-area-inset-bottom,0)}
#top{display:flex;justify-content:space-between;align-items:center;font:12px/1 system-ui,sans-serif;color:var(--dim);padding:6px 2px;font-variant-numeric:tabular-nums}
#top button{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:4px;padding:4px 8px}
#stage{flex:1;position:relative;min-height:0}
#card{position:absolute;inset:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-evenly;will-change:transform}
#w{font-size:clamp(20px,9vw,44px);font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.h{font-size:clamp(17px,7.2vw,34px);line-height:1.15;overflow-wrap:anywhere}
.h small{display:block;font:700 10px/1.4 system-ui,sans-serif;letter-spacing:.08em}
#a{color:var(--a);font-weight:700}#b{color:var(--b)}
#stamp{position:absolute;top:8px;font:800 14px/1 system-ui,sans-serif;letter-spacing:.1em;padding:4px 6px;border:2px solid;border-radius:4px;opacity:0}
#bar{display:flex;gap:8px;padding:8px 0}
#bar button{flex:1;font:700 15px/1 system-ui,sans-serif;padding:12px 0;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
#bar #no{color:var(--not)}#bar #yes{color:var(--hot);border-color:var(--hot)}#bar #undo{flex:.6;color:var(--dim)}
button:focus-visible{outline:2px solid var(--b);outline-offset:2px}
#end{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;font:14px/1.3 system-ui,sans-serif}
#end textarea{flex:1;width:100%;font:12px/1.3 ui-monospace,monospace;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;-webkit-user-select:text;user-select:text}
#end button{font:700 15px/1 system-ui,sans-serif;padding:12px;border-radius:8px;border:1px solid var(--hot);background:var(--card);color:var(--hot)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){#card{transition:none!important}}
</style></head><body>
<div id="top"><span id="n"></span><span id="net"></span><button id="out" type="button">results</button></div>
<div id="stage">
  <div id="card"><span id="stamp"></span>
    <div id="w"></div>
    <div class="h" id="a"></div>
    <div class="h" id="b"></div>
  </div>
  <div id="end" hidden>
    <div id="sum"></div>
    <textarea id="txt" readonly aria-label="Results to paste"></textarea>
    <button id="copy" type="button">Copy results</button>
    <button id="back" type="button">Keep swiping</button>
  </div>
</div>
<div id="bar"><button id="no" type="button">not</button><button id="undo" type="button">undo</button><button id="yes" type="button">hot</button></div>

knew"]], KEY="apms-hot-v1";
let st={v:{},o:[]};
try{st=JSON.parse(localStorage.getItem(KEY))||st}catch(e){}
const $=id=>document.getElementById(id), card=$("card"), stamp=$("stamp");
const PUSH="https://ntfy.sh/apms-weave-5a605d88334691a5";
let pt=0,last=0,dirty=false;
function send(){clearTimeout(pt);pt=0;if(!dirty)return;dirty=false;last=Date.now();
  fetch(PUSH,{method:"POST",body:text(),keepalive:true}).then(r=>{if(!dirty)$("net").textContent=r.ok?"sent":"not sent"},()=>{dirty=true;$("net").textContent="not sent"})}
function push(){dirty=true;$("net").textContent="\u2026";if(!pt)pt=setTimeout(send,Math.max(300,last+6000-Date.now()))}
addEventListener("visibilitychange",()=>{if(document.hidden)send()});addEventListener("pagehide",send);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}push()};
const cur=()=>{for(let i=0;i<DECK.length;i++)if(!(i in st.v))return i;return -1};
function text(){const h=[],n=[];st.o.forEach(i=>(st.v[i]=="h"?h:n).push(i));return "weave hot-or-not v1\nhot: "+h.join(" ")+"\nnot: "+n.join(" ")}
function show(){
  const i=cur(), done=st.o.length;
  $("n").textContent=done+" / "+DECK.length;
  card.style.transition="none";card.style.transform="";card.style.opacity=1;stamp.style.opacity=0;
  if(i<0){results();return}
  $("w").textContent=DECK[i][0];$("a").textContent=DECK[i][1];$("b").textContent=DECK[i][2];
}
function results(){
  const h=st.o.filter(i=>st.v[i]=="h").length;
  $("sum").textContent=h+" hot, "+(st.o.length-h)+" not, "+(DECK.length-st.o.length)+" left. Each swipe is sent on its own. If the top bar says not sent, copy this and paste it to Claude.";
  $("txt").value=text();card.hidden=true;$("bar").hidden=true;$("end").hidden=false;
  $("back").hidden=cur()<0;
}
function vote(v){
  const i=cur();if(i<0||!$("end").hidden)return;
  st.v[i]=v;st.o.push(i);save();
  card.style.transition="transform .18s ease-in,opacity .18s";
  card.style.transform="translateX("+(v=="h"?120:-120)+"%) rotate("+(v=="h"?12:-12)+"deg)";card.style.opacity=0;
  setTimeout(show,190);
}
function undo(){const i=st.o.pop();if(i===undefined)return;delete st.v[i];save();show()}
function mark(dx){const v=dx>0;stamp.textContent=v?"HOT":"NOT";stamp.style.color=v?"var(--hot)":"var(--not)";stamp.style.left=v?"8px":"auto";stamp.style.right=v?"auto":"8px";stamp.style.opacity=Math.min(1,Math.abs(dx)/50)}
let x0=null,dx=0;
card.addEventListener("pointerdown",e=>{x0=e.clientX;dx=0;card.setPointerCapture(e.pointerId);card.style.transition="none"});
card.addEventListener("pointermove",e=>{if(x0===null)return;dx=e.clientX-x0;card.style.transform="translateX("+dx+"px) rotate("+dx/18+"deg)";mark(dx)});
const up=()=>{if(x0===null)return;x0=null;const t=Math.min(60,innerWidth*.22);if(Math.abs(dx)>t)vote(dx>0?"h":"n");else{card.style.transition="transform .15s";card.style.transform="";stamp.style.opacity=0}};
card.addEventListener("pointerup",up);card.addEventListener("pointercancel",up);
$("yes").onclick=()=>vote("h");$("no").onclick=()=>vote("n");$("undo").onclick=undo;
$("out").onclick=results;
$("back").onclick=()=>{$("end").hidden=true;card.hidden=false;$("bar").hidden=false;show()};
$("copy").onclick=()=>{const t=$("txt");const ok=()=>{$("copy").textContent="Copied"};
  (navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(ok,()=>{t.focus();t.select();try{document.execCommand("copy")&&ok()}catch(e){}})};
addEventListener("keydown",e=>{if(e.key=="ArrowRight")vote("h");if(e.key=="ArrowLeft")vote("n");if(e.key=="Backspace"||e.key=="ArrowDown")undo()});
show();
